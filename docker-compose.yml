services:
  # Local model server. The app downloads the model into the volume on first run.
  ollama:
    image: ollama/ollama
    volumes:
      - ollama:/root/.ollama

  app:
    build: .
    image: gene-data-assistant
    depends_on:
      - ollama
    ports:
      - "8501:8501"
    environment:
      OLLAMA_HOST: http://ollama:11434
      # Optional: set OLLAMA_MODEL in your shell to try another model.
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}

volumes:
  ollama:

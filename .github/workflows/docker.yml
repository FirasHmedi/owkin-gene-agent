# Builds the Docker setup, asks the four queries from the brief inside the
# containers, and publishes the app image to GitHub's container registry.
name: docker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build and start both containers
        run: docker compose up --build -d

      - name: Wait for the web app
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8501/_stcore/health && exit 0
            sleep 2
          done
          exit 1

      - name: Ask the four brief queries (the first call downloads the model)
        run: |
          ask() { docker compose exec -T app python cli.py "$1" 2>/dev/null | tee answer.txt; echo; }
          ask "How can you help me?"
          grep -q "Cancers covered" answer.txt
          ask "What are the main genes involved in lung cancer?"
          grep -q "ALK, RET, ROS1, STK11, KRAS" answer.txt
          ask "What is the median value expression of genes involved in breast cancer?"
          grep -q "0.4345" answer.txt
          ask "What is the median value expression of genes involved in esophageal cancer?"
          grep -q "not" answer.txt
          ! grep -q "0\.[0-9]" answer.txt

      - name: Show container logs if something failed
        if: failure()
        run: docker compose logs --tail 200

      - name: Publish the app image to ghcr.io for Intel and ARM machines
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker run --privileged --rm tonistiigi/binfmt --install arm64
          docker buildx create --use
          docker buildx build --platform linux/amd64,linux/arm64 --tag "$IMAGE" --push .
